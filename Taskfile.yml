version: '3'

vars:
  PDFJS_VERSION: '4.10.38'

tasks:
  verify-assets:
    desc: Verify the bundled PDF.js runtime and worker
    cmds:
      - test -s assets/pdfjs/pdf.min.mjs
      - test -s assets/pdfjs/pdf.worker.min.mjs

  build:
    desc: Build the Paperfolio desktop application
    deps: [verify-assets]
    cmds:
      - mkdir -p bin
      - go build -o bin/paperfolio .

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  run:
    desc: Run the Paperfolio desktop application
    cmds:
      - go run .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin
